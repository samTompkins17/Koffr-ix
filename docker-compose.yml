services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: koffr
      POSTGRES_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koffr"]
      interval: 5s
      retries: 10
    ports: ["5432:5432"]

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@koffr.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["5050:80"]
    depends_on: [db]

  auth:
    build: ./services/auth
    volumes:
      - ./services/auth:/var/www
      - auth_vendor:/var/www/vendor
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: auth_db
      DB_USERNAME: koffr
      DB_PASSWORD: secret
    depends_on:
      db: { condition: service_healthy }

  patrimoine:
    build: ./services/patrimoine
    volumes:
      - ./services/patrimoine:/var/www
      - patrimoine_vendor:/var/www/vendor
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: patrimoine_db
      DB_USERNAME: koffr
      DB_PASSWORD: secret
    depends_on:
      db: { condition: service_healthy }

  inventaire:
    build: ./services/inventaire
    volumes:
      - ./services/inventaire:/var/www
      - inventaire_vendor:/var/www/vendor
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: inventaire_db
      DB_USERNAME: koffr
      DB_PASSWORD: secret
    depends_on:
      db: { condition: service_healthy }

  gateway:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./docker/gateway/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: [auth, patrimoine, inventaire]

volumes:
  dbdata:
  auth_vendor:
  patrimoine_vendor:
  inventaire_vendor: