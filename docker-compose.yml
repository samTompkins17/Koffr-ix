services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: koffr
      POSTGRES_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koffr"]
      interval: 5s
      retries: 10
    ports: ["5432:5432"]

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@koffr.tg
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["5050:80"]
    depends_on: [db]

  # JWT_SECRET est commun aux services : chacun vérifie le jeton lui-même.
  auth:
    build: ./services/auth
    volumes:
      - ./services/auth:/var/www
      - auth_vendor:/var/www/vendor
      - auth_storage:/var/www/storage
    environment:
      APP_URL: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-15}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: auth_db
      DB_USERNAME: koffr_auth
      DB_PASSWORD: koffr_auth
    depends_on:
      db: { condition: service_healthy }

  patrimoine:
    build: ./services/patrimoine
    volumes:
      - ./services/patrimoine:/var/www
      - patrimoine_vendor:/var/www/vendor
      - patrimoine_storage:/var/www/storage
    environment:
      APP_URL: http://localhost:8080
      # URL publique encodée dans les QR codes (page de vérification du web).
      PUBLIC_VERIFY_URL: http://localhost:8080/verifier
      JWT_SECRET: ${JWT_SECRET}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: patrimoine_db
      DB_USERNAME: koffr_patrimoine
      DB_PASSWORD: koffr_patrimoine
    depends_on:
      db: { condition: service_healthy }

  inventaire:
    build: ./services/inventaire
    volumes:
      - ./services/inventaire:/var/www
      - inventaire_vendor:/var/www/vendor
      - inventaire_storage:/var/www/storage
      # Photos de contrôle : volume Docker dédié (pas de document-service).
      - inventaire_photos:/var/www/storage/app/controles
    environment:
      APP_URL: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET}
      # Appel interne : inventaire lit la fiche du bien dans patrimoine.
      PATRIMOINE_URL: http://patrimoine:8080
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: inventaire_db
      DB_USERNAME: koffr_inventaire
      DB_PASSWORD: koffr_inventaire
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./services/web
    volumes:
      - ./services/web:/var/www
      - web_vendor:/var/www/vendor
      - web_storage:/var/www/storage
    environment:
      APP_URL: http://localhost:8080
      # L'application web ne parle qu'à la passerelle.
      GATEWAY_URL: http://gateway
      DB_CONNECTION: sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file

  gateway:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./docker/gateway/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: [auth, patrimoine, inventaire, web]

volumes:
  dbdata:
  auth_vendor:
  auth_storage:
  patrimoine_vendor:
  patrimoine_storage:
  inventaire_vendor:
  inventaire_storage:
  inventaire_photos:
  web_vendor:
  web_storage:
