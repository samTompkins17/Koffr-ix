server {
    listen 80;

    # Les conteneurs peuvent changer d'adresse IP quand ils redémarrent.
    # Le resolver de Docker Compose (127.0.0.11) est interrogé régulièrement,
    # sinon Nginx garderait l'IP résolue au démarrage.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Application web (Blade) : c'est elle qui porte l'interface.
    location / {
        set $upstream_web http://web:8080;
        proxy_pass $upstream_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API : un préfixe par service (le préfixe est retiré avant l'appel).
    location /api/auth/ {
        set $upstream_auth http://auth:8080;
        rewrite ^/api/auth/(.*)$ /api/$1 break;
        proxy_pass $upstream_auth;
        proxy_set_header Host $http_host;
    }

    location /api/patrimoine/ {
        set $upstream_patrimoine http://patrimoine:8080;
        rewrite ^/api/patrimoine/(.*)$ /api/$1 break;
        proxy_pass $upstream_patrimoine;
        proxy_set_header Host $http_host;
    }

    location /api/inventaire/ {
        set $upstream_inventaire http://inventaire:8080;
        rewrite ^/api/inventaire/(.*)$ /api/$1 break;
        proxy_pass $upstream_inventaire;
        proxy_set_header Host $http_host;
    }
}
